[project]
name = "bpmn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ED-DAMI", email = "mohamed.eddami@usmba.ac.ma" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pm4py>=2.7.23.11",
    "pyvis>=0.3.2",
]

[project.scripts]
bpmn = "bpmn:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
